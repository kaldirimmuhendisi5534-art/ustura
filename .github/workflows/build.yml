name: Ustura Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profili (preview=APK, production=AAB)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: write

jobs:
  build:
    name: Android Build
    runs-on: self-hosted

    steps:
      - name: Setup Java and Android PATH
        shell: powershell
        run: |
          Add-Content $env:GITHUB_PATH "C:\Program Files\Git\bin"
          Add-Content $env:GITHUB_PATH "C:\Program Files\Git\usr\bin"
          $javaHome    = "$env:LOCALAPPDATA\Java\jdk-17.0.11+9"
          $androidHome = "$env:LOCALAPPDATA\Android\Sdk"
          Add-Content $env:GITHUB_ENV  "JAVA_HOME=$javaHome"
          Add-Content $env:GITHUB_ENV  "ANDROID_HOME=$androidHome"
          Add-Content $env:GITHUB_PATH "$javaHome\bin"
          Add-Content $env:GITHUB_PATH "$androidHome\platform-tools"
          Add-Content $env:GITHUB_PATH "$androidHome\cmdline-tools\latest\bin"
          Write-Host "JAVA_HOME=$javaHome"
          Write-Host "ANDROID_HOME=$androidHome"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create C-slash-u junction for short path
        shell: powershell
        run: |
          if (Test-Path "C:\u") { cmd /c rmdir "C:\u" 2>$null }
          cmd /c mklink /J C:\u "$env:GITHUB_WORKSPACE"
          Write-Host "C:\u -> $env:GITHUB_WORKSPACE"
          Write-Host "package.json exists: $(Test-Path 'C:\u\package.json')"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        shell: bash
        run: cd /c/u && npm install --legacy-peer-deps

      - name: Expo Prebuild
        shell: bash
        run: |
          cd /c/u
          npx expo prebuild --platform android --non-interactive --clean

      - name: Gradle Build
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          KEYSTORE_WIN=$(powershell.exe -Command "echo \$env:USERPROFILE" | tr -d '\r')
          KEYSTORE="$KEYSTORE_WIN/.android/debug.keystore"
          cd /c/u/android
          if [ "$PROFILE" = "production" ]; then
            ./gradlew bundleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$KEYSTORE" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/ustura.aab"
          else
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$KEYSTORE" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ustura.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/ustura"*

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "$GITHUB_WORKSPACE"/ustura* \
            --title "Ustura Build ${{ github.run_number }}" \
            --notes "Ustura APK - Build ${{ github.run_number }} - Branch ${{ github.ref_name }}" \
            --prerelease
